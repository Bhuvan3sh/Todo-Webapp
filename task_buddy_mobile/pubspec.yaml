name: task_buddy_mobile
description: "Task Buddy Flutter Mobile App matching web app UI, theme, Supabase backend, and FCM push notifications."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  firebase_core: ^3.12.0
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1
  provider: ^6.1.2
  intl: ^0.20.2
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  shared_preferences: ^2.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
