<!DOCTYPE html>
<html>
<head><title>Icon Generator</title></head>
<body>
<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>
<script>
function drawIcon(canvas) {
  const ctx = canvas.getContext('2d');
  const s = canvas.width;
  const r = s * 0.28;

  // Rounded rect background
  ctx.fillStyle = '#E0E5EC';
  ctx.beginPath();
  ctx.roundRect(0, 0, s, s, r);
  ctx.fill();

  // Purple circle
  ctx.fillStyle = '#6C63FF';
  ctx.beginPath();
  ctx.arc(s/2, s/2, s*0.32, 0, Math.PI*2);
  ctx.fill();

  // White checkmark
  ctx.strokeStyle = '#FFFFFF';
  ctx.lineWidth = s * 0.08;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(s*0.36, s*0.50);
  ctx.lineTo(s*0.46, s*0.60);
  ctx.lineTo(s*0.65, s*0.40);
  ctx.stroke();
}

drawIcon(document.getElementById('c192'));
drawIcon(document.getElementById('c512'));

// Auto-download
['c192','c512'].forEach(id => {
  const canvas = document.getElementById(id);
  const link = document.createElement('a');
  link.download = `icon-${canvas.width}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
});
</script>
</body>
</html>
